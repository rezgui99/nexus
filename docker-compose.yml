version: '3.8'

# =============================================================================
# NEXUS EMPLOI — Stack complète Docker
# =============================================================================
# Démarre tous les services :
#   docker-compose up -d
#
# Arrête tout :
#   docker-compose down
#
# Voir les logs :
#   docker-compose logs -f
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MongoDB — Stockage des données brutes (Bloc 1)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: nexus_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mongo Express — Interface visuelle MongoDB (http://localhost:8081)
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:latest
    container_name: nexus_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL — Stockage des données structurées après LLM (Bloc 2)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: nexus_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nexus_emploi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexus_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin — Interface visuelle PostgreSQL (http://localhost:5050)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexus_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexus.com
      PGADMIN_DEFAULT_PASSWORD: nexus_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant — Base vectorielle pour le matching sémantique (Bloc 3)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus_qdrant
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

# =============================================================================
# Volumes persistants (tes données survivent aux redémarrages)
# =============================================================================
volumes:
  mongo_data:
  postgres_data:
  qdrant_data: